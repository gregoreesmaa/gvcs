[workspace]
resolver = "2"
members = [
    "crates/gvcs-core",
    "crates/gvcs-cli",
    "examples/todo-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gregoreesmaa/gvcs"
authors = ["Gregor Eesmaa"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
regex = "1.10"
