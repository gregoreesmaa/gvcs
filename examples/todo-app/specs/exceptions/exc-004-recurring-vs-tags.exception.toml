id = "EXC-004-recurring-vs-tags"
features = ["feat:recurring-tasks", "feat:tags-and-search"]
conflict_summary = "Both 'Recurring tasks automatically spawn the next occurrence upon completion' and 'Users can organize tasks with project tags, search keywords, and filter views' mutate shared substrate [\"DBTable:todos\", \"Viewport:TodoList\"]."
chosen_option = "OPT-INHERIT-TAGS-ON-SPAWN"
resolution_directive = "When a recurring task is completed and spawns its next cycle occurrence, automatically carry forward all #tags from the completed parent task."

