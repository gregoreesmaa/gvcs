id = "PARETO-001-cache-vs-gdpr"
between = ["fast-cache-sla", "gdpr-privacy"]
question = "How should the sub-25ms memory cache behave when a user clicks GDPR Erase?"
decision = "Clear the in-memory read cache immediately inside the GDPR erase step before returning (0ms stale data)."
alternatives = [
  "Clear cache immediately on GDPR erase (Chosen: <2ms reads, 0ms stale data)",
  "Disable caching for personal tasks (~18ms disk reads on every view)"
]
