  "exceptions": {
    "EXC-002-crud-vs-recurring": {
      "id": "EXC-002-crud-vs-recurring",
      "features": [
        "feat:recurring-tasks",
        "feat:todo-crud"
      ],
      "conflict_summary": "Both 'Users can create, list, and complete todo tasks' and 'Recurring tasks automatically spawn the next occurrence upon completion' mutate shared substrate [\"DBTable:todos\", \"Viewport:TodoList\"].",
      "options": [
        {
          "option_id": "OPT-ATOMIC-COMPLETE-AND-SPAWN",
          "label": "Atomic Complete & Spawn Next Cycle in Single Fused Mutation",
          "business_impact": "Completing a recurring task immediately shows the newly scheduled next occurrence in the same list refresh.",
          "estimated_cost_or_latency": "0ms extra round-trip"
        }
      ],
      "chosen_option": "OPT-ATOMIC-COMPLETE-AND-SPAWN",
      "resolution_directive": "Fuse recurring task roll-forward directly inside the task completion transaction when recurrence_days is present AND the canary flag `flag_recurring_tasks` is enabled."
    },
    "PARETO-001-cache-vs-gdpr": {
      "id": "PARETO-001-cache-vs-gdpr",
      "features": [
        "cap:fast-cache-sla",
        "cap:gdpr-privacy"
      ],
      "conflict_summary": "PACELC Tradeoff between 'Sub-25ms Read Latency SLA via Write-Through Memory Cache' (<25ms cached reads) and 'EU Privacy Safe (GDPR Right to Erasure & Portability)' (0ms stale PII after erasure).",
      "options": [
        {
          "option_id": "OPT-SYNCHRONOUS-INVALIDATION",
          "label": "Write-Through Cache Purge on GDPR Erase (Recommended)",
          "business_impact": "Normal Todo reads stay fast (<2ms via in-memory cache); GDPR erasure synchronously zeroes the cache before returning.",
          "estimated_cost_or_latency": "Read p99: 1.2ms | Erase p99: 4.5ms"
        },
        {
          "option_id": "OPT-NO-CACHE-STRICT",
          "label": "Disable Read Caching for PII Entities",
          "business_impact": "Guaranteed zero cache lag, but list queries hit primary storage on every view.",
          "estimated_cost_or_latency": "Read p99: 18ms | Erase p99: 2.0ms"
        }
      ],
      "chosen_option": "OPT-SYNCHRONOUS-INVALIDATION",
      "resolution_directive": "Maintain in-memory read cache for sub-25ms reads, but execute synchronous cache key eviction inside the atomic GDPR erasure transaction before returning."
    }
  },
  "incidents": {
    "INC-001-double-complete-spawn": {
      "id": "INC-001-double-complete-spawn",
      "title": "Double-clicking Complete on a recurring task spawned two duplicate future tasks",
      "affected_features": [
        "feat:recurring-tasks",
        "feat:todo-crud"
      ],
